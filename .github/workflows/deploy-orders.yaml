name: deploy-orders
on:
    push:
        branches: 
            - main 
        paths: 
            - 'orders/**'
jobs: 
    build:
        runs-on: ubuntu-latest 
        steps: 
            - uses: actions/checkout@v2 
            - run: cd orders && docker build -t nikapanchulidze/orders .
            - 
              uses: docker/login-action@v1 
              with: 
                 username: ${{ secrets.DOCKER_USERNAME }}
                 password: ${{ secrets.DOCKERHUB_TOKEN }} 
            - run: docker push nikapanchulidze/orders
